<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Garcia Local Marketplace</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
  <canvas class="cosmos-canvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <a class="brand" href="/">Marketplace</a>
    <button class="menu-button" type="button" data-menu-button aria-label="Open navigation">Menu</button>
    <nav class="site-nav" data-site-nav aria-label="Main navigation">
      <a href="/" data-nav-link="home">Home</a>
      <a href="/products" data-nav-link="products">Products</a>
      <a href="/stats" data-nav-link="stats">Stats</a>
      <a href="/login" data-auth-link="login">Log In</a>
      <a class="nav-button" href="/signup" data-auth-link="signup">Sign Up</a>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <h1>Welcome Back</h1>
      <p>Log in to your marketplace account.</p>
      <form class="auth-form" data-auth-form data-endpoint="/api/v1/users/login" data-success="Login successful.">
        <label>
          <span>Email address</span>
          <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        </label>
        <button class="button button-primary" type="submit">Log In</button>
        <p class="form-message" data-form-message role="status"></p>
      </form>
      <p class="switch-copy">Don't have an account? <a href="/signup">Sign up</a></p>
    </section>
  </main>

  <script src="/marketplace.js" defer></script>
</body>
</html>
