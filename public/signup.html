<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Garcia Local Marketplace</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="signup">
  <canvas class="cosmos-canvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <a class="brand" href="/">Marketplace</a>
    <button class="menu-button" type="button" data-menu-button aria-label="Open navigation">Menu</button>
    <nav class="site-nav" data-site-nav aria-label="Main navigation">
      <a href="/" data-nav-link="home">Home</a>
      <a href="/products" data-nav-link="products">Products</a>
      <a href="/stats" data-nav-link="stats">Stats</a>
      <a href="/login" data-auth-link="login">Log In</a>
      <a class="nav-button" href="/signup" data-auth-link="signup">Sign Up</a>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <h1>Create Account</h1>
      <p>Join the marketplace and start buying or selling today.</p>
      <form class="auth-form" data-auth-form data-endpoint="/api/v1/users/signup" data-success="Account created.">
        <label>
          <span>Full name</span>
          <input name="name" type="text" autocomplete="name" placeholder="Juan Dela Cruz" required>
        </label>
        <label>
          <span>Email address</span>
          <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="new-password" placeholder="Min. 8 characters" minlength="8" required>
        </label>
        <label>
          <span>Confirm password</span>
          <input name="passwordConfirm" type="password" autocomplete="new-password" placeholder="Re-enter password" minlength="8" required>
        </label>
        <button class="button button-primary" type="submit">Create Account</button>
        <p class="form-message" data-form-message role="status"></p>
      </form>
      <p class="switch-copy">Already have an account? <a href="/login">Log in</a></p>
    </section>
  </main>

  <script src="/marketplace.js" defer></script>
</body>
</html>
