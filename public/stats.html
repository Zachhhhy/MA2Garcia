<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats | Garcia Local Marketplace</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="stats">
  <canvas class="cosmos-canvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <a class="brand" href="/">Marketplace</a>
    <button class="menu-button" type="button" data-menu-button aria-label="Open navigation">Menu</button>
    <nav class="site-nav" data-site-nav aria-label="Main navigation">
      <a href="/" data-nav-link="home">Home</a>
      <a href="/products" data-nav-link="products">Products</a>
      <a href="/stats" data-nav-link="stats">Stats</a>
      <a href="/login" data-auth-link="login">Log In</a>
      <a class="nav-button" href="/signup" data-auth-link="signup">Sign Up</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="page-heading">
      <p class="kicker">Analytics</p>
      <h1>Market Insights</h1>
      <p>Track product distribution and pricing across every marketplace category.</p>
    </section>

    <section class="metric-strip" aria-label="Marketplace totals">
      <article>
        <span data-stat-total-products>0</span>
        <p>Total products</p>
      </article>
      <article>
        <span data-stat-total-value>₱0</span>
        <p>Total list value</p>
      </article>
      <article>
        <span data-stat-total-categories>0</span>
        <p>Categories</p>
      </article>
    </section>

    <p class="status-message" data-stats-status>Loading stats...</p>
    <section class="stats-grid" data-stats-grid aria-label="Category statistics"></section>
  </main>

  <script src="/marketplace.js" defer></script>
</body>
</html>
